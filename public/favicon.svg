<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- タスクマネージャーのアイコン（#52）。進み具合のボード：左の列が未着手、右の列が作業中。黄色のカードは期限間近 -->
  <rect width="64" height="64" rx="14" fill="#1f2937"/>
  <!-- 2つの列 -->
  <rect x="7" y="8" width="23" height="48" rx="5" fill="#4b5563"/>
  <rect x="34" y="8" width="23" height="48" rx="5" fill="#4b5563"/>
  <!-- 列の見出し -->
  <rect x="11" y="12" width="15" height="4" rx="2" fill="#d1d5db"/>
  <rect x="38" y="12" width="15" height="4" rx="2" fill="#d1d5db"/>
  <!-- カード -->
  <rect x="10" y="20" width="17" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="10" y="34" width="17" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="37" y="20" width="17" height="11" rx="2.5" fill="#f59e0b"/>
</svg>
