# push と PR のたびに自動テストを流す
# 手元の Sail と同じ条件（PHP 8.5・MySQL 8.4）にそろえている
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        # MySQL が使えるようになるまで待つ
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none

      - name: Composer のパッケージを入れる
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env を用意する
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: テストを流す
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: php artisan test
